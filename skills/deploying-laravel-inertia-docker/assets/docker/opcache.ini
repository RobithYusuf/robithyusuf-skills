; Production only. validate_timestamps=0: perubahan file PHP tidak terdeteksi sampai container restart.
; Aman karena kode di image immutable. Jangan dimuat di dev.
opcache.enable = 1
opcache.memory_consumption = 256
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = 1255
opcache.jit_buffer_size = 128M
