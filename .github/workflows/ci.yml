name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # riwayat penuh, supaya pemindaian mencakup semua commit

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validasi skill & pindai riwayat
        run: sh scripts/check.sh --history

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
